<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Recontei</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #000; color: #fff; font-family: Inter, system-ui, sans-serif; }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      }
      .mark { width: 36px; height: 36px; }
      h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.04em; }
      p { margin: 0; color: #c8c8c8; line-height: 1.45; max-width: 22rem; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 6.5a9.5 9.5 0 1 1-6.8 2.8" fill="none" stroke="#e7dcc8" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M7.6 6.8l.4 4.6 4.4-1.6" fill="none" stroke="#e7dcc8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Recontei</h1>
      <p>Sem conexão. Abra o Recontei de novo quando a internet voltar.</p>
    </main>
  </body>
</html>
