<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f1ea;padding:32px 0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px;">
      <tr><td>
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="padding-right:10px;"><img src="https://ciclo-peach.vercel.app/icons/logo-animado.gif" width="32" height="32" alt="" style="display:block;border:0;border-radius:8px;"></td>

        </tr></table>
      </td></tr>

      <tr><td align="center" style="padding-top:12px;font-size:12px;color:#8a7f6e;">Toque e segure o código para copiar.</td></tr>

  </td></tr>
