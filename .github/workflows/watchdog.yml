name: watchdog

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-age:
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the last sync is older than 48 hours
        env:
          CICLO_URL: ${{ secrets.CICLO_URL }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.request
          base = os.environ.get("CICLO_URL", "").rstrip("/")
          token = os.environ.get("HEALTH_TOKEN", "")
          if not base or not token:
              raise SystemExit("CICLO_URL and HEALTH_TOKEN are required")
          request = urllib.request.Request(base + "/api/health", headers={"Authorization": f"Bearer {token}"})
          with urllib.request.urlopen(request, timeout=30) as response:
              body = json.load(response)
          age = body.get("lastSyncAgeHours")
          print(f"lastSyncAgeHours={age}")
          if age is None or age > 48:
              raise SystemExit(f"last sync is too old: {age}")
          PY
